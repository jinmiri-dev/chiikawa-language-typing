# 언어 1급 중계 함수. 배포는 사용자가 한다(docs/직접-해야-할-일.md).
name = "language-grade1"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://jinmiri-dev.github.io,http://localhost:5173,http://localhost:4173"

# npx wrangler kv namespace create CACHE 로 만든 id 를 넣는다
[[kv_namespaces]]
binding = "KV"
id = "9a73aa270cd04e03a566def64a7da983"

# 비밀값(키)은 여기 쓰지 않는다: npx wrangler secret put YOUTUBE_API_KEY 등

[ai]
binding = "AI"

# 매일 09:30·19:00(한국 시각) 오늘의 뉴스를 미리 만든다(AI 무료 사용량은 09:00 에 다시 채워진다)
# 두 시간마다 15분: 영상 자막의 빠진 한국어 뜻을 채운다(몽골어 먼저)
[triggers]
crons = ["30 0 * * *", "0 10 * * *", "15 */2 * * *"]
