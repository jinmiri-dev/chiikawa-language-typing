version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # 런타임이 Node 24라서 타입도 24에 맞춘다
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
